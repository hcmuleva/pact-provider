name: Provider - Webhook Verification

on:
  repository_dispatch:
    types:
      - contract_requiring_verification_published
      - contract_content_changed
      - contract_published

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_BASIC_AUTH_USERNAME }}
  PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_BASIC_AUTH_PASSWORD }}

jobs:
  verify-changed-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log webhook payload
        run: |
          echo "🔔 Webhook Triggered!"
          echo "Event: ${{ github.event.action }}"
          echo "Consumer: ${{ github.event.client_payload.consumer_name }}"
          echo "Provider: UserService"
          echo "Pact URL: ${{ github.event.client_payload.pact_url }}"
          echo "Consumer Version: ${{ github.event.client_payload.consumer_version_number }}"
          echo "Consumer Branch: ${{ github.event.client_payload.consumer_version_branch }}"

      - name: Run Pact verification
        id: verify
        run: npm run test:pact:verify
        env:
          CI: "true"
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: ${{ github.ref_name }}
          PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_BASIC_AUTH_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_BASIC_AUTH_PASSWORD }}
          PROVIDER_VERSION: ${{ github.sha }}

      - name: Record deployment to test environment
        if: success()
        run: |
          echo "📝 Recording deployment to test environment..."
          npx pact-broker record-deployment \
            --pacticipant=UserService \
            --version=${{ github.sha }} \
            --environment=test \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }}

      - name: Verification successful
        if: success()
        run: |
          echo "✅ Provider verification passed!" >> $GITHUB_STEP_SUMMARY
          echo "Consumer: ${{ github.event.client_payload.consumer_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.event.client_payload.consumer_version_number }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.event.client_payload.consumer_version_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Recorded deployment to **test** environment" >> $GITHUB_STEP_SUMMARY

      - name: Verification failed
        if: failure()
        run: |
          echo "❌ Provider verification failed!" >> $GITHUB_STEP_SUMMARY
          echo "Consumer: ${{ github.event.client_payload.consumer_name }}" >> $GITHUB_STEP_SUMMARY
          echo "This may break the consumer application!" >> $GITHUB_STEP_SUMMARY
          exit 1