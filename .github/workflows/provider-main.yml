# FILE: .github/workflows/provider-main.yml
name: Provider - Main Branch

on:
  push:
    branches: [main]

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_BASIC_AUTH_USERNAME }}
  PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Get package version
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Run Pact verification
        run: npm run test:pact:verify
        env:
          CI: true
          GIT_COMMIT: ${{ github.sha }}
          GIT_BRANCH: main
          PROVIDER_VERSION: ${{ steps.package-version.outputs.version }}
          PACT_BROKER_BASE_URL: ${{ env.PACT_BROKER_BASE_URL }}
          PACT_BROKER_USERNAME: ${{ env.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ env.PACT_BROKER_PASSWORD }}

      - name: Can I deploy to production?
        id: can-i-deploy
        continue-on-error: true
        run: |
          npx pact-broker can-i-deploy \
            --pacticipant=UserService \
            --version=${{ steps.package-version.outputs.version }} \
            --to-environment=production \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }}

      - name: Record deployment
        if: steps.can-i-deploy.outcome == 'success'
        run: |
          npx pact-broker record-deployment \
            --pacticipant=UserService \
            --version=${{ steps.package-version.outputs.version }} \
            --environment=production \
            --broker-base-url=${{ env.PACT_BROKER_BASE_URL }} \
            --broker-username=${{ env.PACT_BROKER_USERNAME }} \
            --broker-password=${{ env.PACT_BROKER_PASSWORD }}

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release